<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging into phpMyAdmin...</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #e2e8f0;
            border-bottom-color: #5b5fcf;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full mx-auto p-8 text-center fade-in">
        <!-- Logo/Icon Area -->
        <div class="mb-8 relative inline-block">
            <div class="absolute inset-0 bg-blue-500/20 blur-3xl rounded-full"></div>
            <div class="relative bg-white p-6 rounded-3xl shadow-xl border border-slate-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-[#5b5fcf]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                </svg>
            </div>
        </div>

        <!-- Text Area -->
        <h1 class="text-2xl font-extrabold text-slate-900 mb-3 tracking-tight">
            Connecting to phpMyAdmin
        </h1>
        <p class="text-slate-500 mb-8 leading-relaxed">
            Please wait while we establish a secure session for your database management.
        </p>

        <!-- Loader -->
        <div class="mb-8">
            <span class="loader"></span>
        </div>

        <!-- Progress Info -->
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm inline-flex items-center gap-3">
            <div class="flex gap-1">
                <div class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse delay-75"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse delay-150"></div>
            </div>
            <span class="text-sm font-semibold text-slate-600 uppercase tracking-widest">
                Authorizing Session
            </span>
        </div>

        <!-- Hidden Form -->
        <span style="display: none" id="userName">{{ userName }}</span>
        <span style="display: none" id="password">{{ password }}</span>
        <form style="display: none" name="loginform" id="loginform" action="/phpmyadmin/phpmyadminsignin.php" method="post">
            {% csrf_token %}
            <input type="text" name="username" id="user_login" value=""/>
            <input type="password" name="password" id="user_pass" value=""/>
            <input type="hidden" name="redirect_to" value="{{ url }}/wp-admin"/>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            // Populate and submit form after a short delay for smooth UI
            setTimeout(function() {
                document.getElementById("user_login").value = $("#userName").text();
                document.getElementById("user_pass").value = $("#password").text();
                document.forms["loginform"].submit();
            }, 800);
        });
    </script>
</body>
</html>
