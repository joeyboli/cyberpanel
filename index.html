<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Ready</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-feature-settings: "ss01", "ss02", "cv01", "cv02";
    }
  </style>
</head>
<body class="bg-white text-black min-h-screen flex items-center justify-center">

  <main class="w-full max-w-4xl px-6">

    <!-- Top subtle label -->
    <div class="mb-12">
      <p class="text-xs text-gray-400 tracking-wide uppercase">
        Deployment Status
      </p>
    </div>

    <!-- Main content -->
    <div class="space-y-10">

      <h1 class="text-5xl md:text-6xl font-semibold tracking-tight">
        Your website is live.
      </h1>

      <p class="text-lg text-gray-600 max-w-2xl leading-relaxed">
        This default page confirms your domain is correctly configured and serving content.
        Replace it with your own project to get started.
      </p>

      <!-- Divider -->
      <div class="border-t border-gray-200 pt-6 flex items-center justify-between text-sm">
        <span class="text-gray-400">Status</span>
        <span class="font-medium">● Online</span>
      </div>

    </div>

  </main>

</body>
</html>
