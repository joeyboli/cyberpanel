{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en" ng-app="loginSystem" class="light" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>{% trans "Login - CyberPanel" %}</title>
    <meta name="description" content="Login to your CyberPanel Account">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['DM Sans', 'system-ui', 'sans-serif'],
              mono: ['DM Mono', 'JetBrains Mono', 'monospace'],
              display: ['Syne', 'system-ui', 'sans-serif'],
            },
            colors: {
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              card: {
                DEFAULT: 'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
            },
            borderRadius: {
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 2px)',
              sm: 'calc(var(--radius) - 4px)',
            },
          }
        }
      }
    </script>

    <!-- Fonts: Syne (display) + DM Sans (body) + DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* ============================================================
         CYBERPANEL LOGIN — DESIGN SYSTEM (Matches baseTemplate/index.html)
      ============================================================ */

      :root {
        /* Light Mode */
        --background:        220 20% 97%;
        --foreground:        222 30% 12%;
        --card:              0 0% 100%;
        --card-foreground:   222 30% 12%;
        --popover:           0 0% 100%;
        --popover-foreground:222 30% 12%;
        --primary:           222 47% 18%;
        --primary-foreground:0 0% 98%;
        --secondary:         220 16% 92%;
        --secondary-foreground:222 30% 20%;
        --muted:             220 14% 94%;
        --muted-foreground:  220 12% 50%;
        --accent:            195 80% 92%;
        --accent-foreground: 195 80% 20%;
        --destructive:       4 86% 58%;
        --destructive-foreground:0 0% 98%;
        --border:            220 16% 88%;
        --input:             220 16% 88%;
        --ring:              195 80% 42%;
        --radius:            0.45rem;

        /* Brand accent: cyan-teal */
        --accent-cyan:       189 80% 42%;
      }

      .dark {
        --background:        222 22% 9%;
        --foreground:        215 20% 92%;
        --card:              222 22% 11%;
        --card-foreground:   215 20% 92%;
        --popover:           222 22% 11%;
        --popover-foreground:215 20% 92%;
        --primary:           0 0% 96%;
        --primary-foreground:222 30% 10%;
        --secondary:         222 20% 16%;
        --secondary-foreground:215 20% 85%;
        --muted:             222 20% 15%;
        --muted-foreground:  215 14% 52%;
        --accent:            189 60% 20%;
        --accent-foreground: 189 80% 72%;
        --destructive:       4 72% 45%;
        --destructive-foreground:0 0% 98%;
        --border:            222 22% 18%;
        --input:             222 22% 18%;
        --ring:              189 80% 42%;
      }

      body {
        font-family: 'DM Sans', system-ui, sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-size: 13.5px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Subtle grid background (matches base template aesthetic) */
      .grid-background {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(to right, hsl(var(--border) / 0.1) 1px, transparent 1px),
          linear-gradient(to bottom, hsl(var(--border) / 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, #000 70%, transparent 100%);
        pointer-events: none;
        z-index: -1;
      }

      /* Subtle glow accent */
      .glow {
        position: absolute;
        width: 300px;
        height: 300px;
        background: hsl(var(--accent-cyan) / 0.1);
        filter: blur(100px);
        border-radius: 100%;
        z-index: -1;
        animation: pulse 8s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }

      /* Custom select styling to match shadcn inputs */
      select.shadcn-input {
        appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 0.75rem center;
        background-repeat: no-repeat;
        background-size: 1.25em 1.25em;
        padding-right: 2.5rem;
      }

      /* Loading spinner */
      #verifyingLogin {
        display: none;
        margin: 10px auto;
        width: 32px;
      }

      /* Smooth fade-in animation */
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Remove shadows globally for flat design */
      .no-shadow, .no-shadow * {
        box-shadow: none !important;
      }
    </style>

    <script src="{% static 'baseTemplate/assets/js-core/jquery-core.min.js' %}"></script>
    <script>
        var application = angular.module('loginSystem', []);
        application.config(['$interpolateProvider',
            function ($interpolateProvider) {
                $interpolateProvider.startSymbol('{$');
                $interpolateProvider.endSymbol('$}');
            }
        ]);
    </script>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

<!-- Background elements -->
<div class="grid-background"></div>
<div class="glow" style="top: 10%; right: 10%;"></div>
<div class="glow" style="bottom: 10%; left: 10%; background: hsl(var(--primary) / 0.08);"></div>

<div ng-controller="loginSystem" class="w-full max-w-[420px] animate-fade-in relative z-10">

    <!-- Logo & Header -->
    <div class="flex flex-col items-center mb-8">
        <div class="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center mb-4 border border-primary/20">
             <img src="{% static 'baseTemplate/cyber-panel-logo.svg' %}" class="w-7 h-7 invert brightness-0" alt="CyberPanel">
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-foreground font-display">CyberPanel</h1>
        <p class="text-base text-muted-foreground mt-1">{% trans "Web Hosting Control Panel" %}</p>
    </div>

    <!-- Login Card - Flat design, no shadows -->
    <div class="bg-card text-card-foreground rounded-2xl border border-border overflow-hidden">
        <div class="p-8 space-y-6">

            <!-- Card Header -->
            <div class="space-y-2 text-center">
                <h2 class="text-xl font-bold tracking-tight text-foreground">{% trans "Login" %}</h2>
                <p class="text-sm text-muted-foreground">{% trans "Enter your credentials to access your account" %}</p>
            </div>

            <form id="loginForm" action="/" class="space-y-5">

                <!-- Username Field -->
                <div class="space-y-2">
                    <label class="text-sm font-bold text-foreground uppercase tracking-wider" for="username">
                        {% trans "Username" %}
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="user" class="h-5 w-5 text-muted-foreground group-focus-within:text-primary transition-colors"></i>
                        </div>
                        <input ng-model="username" type="text" id="username" name="username"
                               class="w-full pl-12 pr-4 py-3 bg-secondary/20 border border-border rounded-xl text-sm font-medium focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-muted-foreground"
                               placeholder="{% trans 'Enter username' %}" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="space-y-2">
                    <label class="text-sm font-bold text-foreground uppercase tracking-wider" for="password">
                        {% trans "Password" %}
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="h-5 w-5 text-muted-foreground group-focus-within:text-primary transition-colors"></i>
                        </div>
                        <input ng-keypress="initiateLogin($event)" ng-model="password" type="password"
                               id="password" name="password" autocomplete="current-password"
                               class="w-full pl-12 pr-4 py-3 bg-secondary/20 border border-border rounded-xl text-sm font-medium focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-muted-foreground"
                               placeholder="{% trans 'Enter password' %}" required>
                    </div>
                </div>

                <!-- 2FA Field (conditional) -->
                <div ng-hide="verifyCode" class="space-y-2">
                    <label class="text-sm font-bold text-foreground uppercase tracking-wider" for="twofa">
                        {% trans "2FA Code" %}
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="shield-check" class="h-5 w-5 text-muted-foreground group-focus-within:text-primary transition-colors"></i>
                        </div>
                        <input ng-model="twofa" type="text" id="twofa" name="twofa"
                               class="w-full pl-12 pr-4 py-3 bg-secondary/20 border border-border rounded-xl text-sm font-medium focus:ring-2 focus:ring-primary/20 outline-none transition-all placeholder:text-muted-foreground"
                               placeholder="{% trans 'Google Authenticator code' %}" required>
                    </div>
                </div>

                <!-- Language Selector -->
                <div class="space-y-2">
                    <label class="text-sm font-bold text-foreground uppercase tracking-wider" for="language">
                        {% trans "Language" %}
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="languages" class="h-5 w-5 text-muted-foreground group-focus-within:text-primary transition-colors"></i>
                        </div>
                        <select ng-model="languageSelection" ng-init="languageSelection='english'"
                                id="language"
                                class="shadcn-input w-full pl-12 pr-4 py-3 bg-secondary/20 border border-border rounded-xl text-sm font-medium focus:ring-2 focus:ring-primary/20 outline-none transition-all appearance-none cursor-pointer">
                            <option value="english">English</option>
                            <option>Bangla</option>
                            <option>Bosnian</option>
                            <option>Bulgarian</option>
                            <option>Chinese</option>
                            <option>French</option>
                            <option>German</option>
                            <option>Greek</option>
                            <option>Italian</option>
                            <option>Indonesian</option>
                            <option>Japanese</option>
                            <option>Polish</option>
                            <option>Portuguese</option>
                            <option>Russian</option>
                            <option>Spanish</option>
                            <option>Turkish</option>
                            <option>Vietnamese</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <i data-lucide="chevron-down" class="h-4 w-4 text-muted-foreground"></i>
                        </div>
                    </div>
                </div>

                <!-- Login Button - Base template pattern -->
                <div class="pt-2">
                    <button type="button" ng-click="verifyLoginCredentials()"
                            class="w-full px-6 py-3 bg-primary text-primary-foreground rounded-xl font-bold transition-all hover:opacity-90 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i data-lucide="log-in" class="h-5 w-5"></i>
                        {% trans "Sign In" %}
                    </button>
                </div>

                <!-- Loading Indicator -->
                <div id="verifyingLogin" class="flex justify-center py-2">
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: -0.3s"></div>
                        <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: -0.15s"></div>
                        <div class="w-2 h-2 bg-primary rounded-full animate-bounce"></div>
                    </div>
                </div>
            </form>

            <!-- Error Message -->
            <div id="loginFailed" class="hidden p-4 rounded-xl bg-destructive/10 border border-destructive/20 text-destructive text-sm text-center font-medium">
                <p>{% trans "Could Not Login:" %} <span ng-bind="errorMessage" class="font-bold"></span></p>
            </div>
        </div>
    </div>

    <!-- Footer Links (optional) -->
    <div class="text-center mt-6 text-sm text-muted-foreground">
        <p>© {% now "Y" %} CyberPanel. {% trans "All rights reserved." %}</p>
    </div>
</div>

<script src="{% static 'baseTemplate/angularjs.1.6.5.js' %}"></script>
<script src="https://code.angularjs.org/1.6.5/angular-route.min.js"></script>
<script src="{% static 'loginSystem/login-system.js' %}"></script>
<script>
    // Initialize Lucide Icons after DOM load
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    });
</script>

</body>
</html>
