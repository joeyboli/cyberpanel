<!DOCTYPE html>
<html lang="en" ng-app="loginSystem">

<head>
    <meta charset="UTF-8">
    <title> Login - CyberPanel </title>
    <meta name="description" content="Login to your CyberPanel Account">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              card: {
                DEFAULT: 'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
            },
            borderRadius: {
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 2px)',
              sm: 'calc(var(--radius) - 4px)',
            },
          }
        }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --card: 0 0% 100%;
        --card-foreground: 240 10% 3.9%;
        --popover: 0 0% 100%;
        --popover-foreground: 240 10% 3.9%;
        --primary: 240 5.9% 10%;
        --primary-foreground: 0 0% 98%;
        --secondary: 240 4.8% 95.9%;
        --secondary-foreground: 240 5.9% 10%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --accent: 240 4.8% 95.9%;
        --accent-foreground: 240 5.9% 10%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --border: 240 5.9% 90%;
        --input: 240 5.9% 90%;
        --ring: 240 5.9% 10%;
        --radius: 0.5rem;
      }

      .dark {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --card: 240 10% 3.9%;
        --card-foreground: 0 0% 98%;
        --popover: 240 10% 3.9%;
        --popover-foreground: 0 0% 98%;
        --primary: 0 0% 98%;
        --primary-foreground: 240 5.9% 10%;
        --secondary: 240 3.7% 15.9%;
        --secondary-foreground: 0 0% 98%;
        --muted: 240 3.7% 15.9%;
        --muted-foreground: 240 5% 64.9%;
        --accent: 240 3.7% 15.9%;
        --accent-foreground: 0 0% 98%;
        --destructive: 0 62.8% 30.6%;
        --destructive-foreground: 0 0% 98%;
        --border: 240 3.7% 15.9%;
        --input: 240 3.7% 15.9%;
        --ring: 240 4.9% 83.9%;
      }

      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Inter', sans-serif;
      }

      /* Custom styles for select to match shadcn inputs */
      select.shadcn-input {
        appearance: none;
        background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
        background-position: right 0.5rem center;
        background-repeat: no-repeat;
        background-size: 1.5em 1.5em;
        padding-right: 2.5rem;
      }

      #verifyingLogin {
        display: none;
        margin: 10px auto;
        width: 32px;
      }
    </style>

    <script src="{% static 'baseTemplate/assets/js-core/jquery-core.min.js' %}"></script>
    <script>
        var application = angular.module('loginSystem', []);
        application.config(['$interpolateProvider',
            function ($interpolateProvider) {
                $interpolateProvider.startSymbol('{$');
                $interpolateProvider.endSymbol('$}');
            }
        ]);
    </script>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div ng-controller="loginSystem" class="w-full max-w-[400px] animate-fade-in">
    <div class="flex flex-col items-center mb-8">
        <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-primary/20">
             <img src="{% static 'baseTemplate/cyber-panel-logo.svg' %}" class="w-8 h-8 invert brightness-0" alt="CyberPanel">
        </div>
        <h1 class="text-2xl font-bold tracking-tight">CyberPanel</h1>
        <p class="text-sm text-muted-foreground mt-1">Web Hosting Control Panel</p>
    </div>

    <div class="bg-card text-card-foreground rounded-lg border border-border shadow-sm overflow-hidden">
        <div class="p-6 space-y-6">
            <div class="space-y-2 text-center">
                <h2 class="text-xl font-semibold leading-none tracking-tight">Login</h2>
                <p class="text-sm text-muted-foreground">Enter your credentials to access your account</p>
            </div>

            <form id="loginForm" action="/" class="space-y-4">
                <div class="space-y-2">
                    <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="username">
                        Username
                    </label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-3 h-4 w-4 text-muted-foreground"></i>
                        <input ng-model="username" type="text" id="username" name="username"
                               class="flex h-10 w-full rounded-md border border-input bg-background px-10 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                               placeholder="Enter username" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="password">
                        Password
                    </label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-3 top-3 h-4 w-4 text-muted-foreground"></i>
                        <input ng-keypress="initiateLogin($event)" ng-model="password" type="password"
                               id="password" name="password" autocomplete="current-password"
                               class="flex h-10 w-full rounded-md border border-input bg-background px-10 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                               placeholder="Enter password" required>
                    </div>
                </div>

                <div ng-hide="verifyCode" class="space-y-2">
                    <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="twofa">
                        2FA Code
                    </label>
                    <div class="relative">
                        <i data-lucide="shield-check" class="absolute left-3 top-3 h-4 w-4 text-muted-foreground"></i>
                        <input ng-model="twofa" type="text" id="twofa" name="twofa"
                               class="flex h-10 w-full rounded-md border border-input bg-background px-10 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
                               placeholder="Google Authenticator code" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="language">
                        Language
                    </label>
                    <div class="relative">
                        <i data-lucide="languages" class="absolute left-3 top-3 h-4 w-4 text-muted-foreground pointer-events-none"></i>
                        <select ng-model="languageSelection" ng-init="languageSelection='english'"
                                id="language"
                                class="shadcn-input flex h-10 w-full rounded-md border border-input bg-background px-10 py-2 text-sm ring-offset-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50">
                            <option value="english">English</option>
                            <option>Bangla</option>
                            <option>Bosnian</option>
                            <option>Bulgarian</option>
                            <option>Chinese</option>
                            <option>French</option>
                            <option>German</option>
                            <option>Greek</option>
                            <option>Italian</option>
                            <option>Indonesian</option>
                            <option>Japanese</option>
                            <option>Polish</option>
                            <option>Portuguese</option>
                            <option>Russian</option>
                            <option>Spanish</option>
                            <option>Turkish</option>
                            <option>Vietnamese</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="button" ng-click="verifyLoginCredentials()"
                            class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 w-full">
                        Sign In
                    </button>
                </div>

                <div id="verifyingLogin" class="flex justify-center py-2">
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: -0.3s"></div>
                        <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: -0.15s"></div>
                        <div class="w-2 h-2 bg-primary rounded-full animate-bounce"></div>
                    </div>
                </div>
            </form>

            <div id="loginFailed" class="hidden p-3 rounded-md bg-destructive/15 border border-destructive/20 text-destructive text-sm text-center">
                <p>Could Not Login: <span ng-bind="errorMessage"></span></p>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'baseTemplate/angularjs.1.6.5.js' %}"></script>
<script src="https://code.angularjs.org/1.6.5/angular-route.min.js"></script>
<script src="{% static 'loginSystem/login-system.js' %}"></script>
<script>
    // Initialize Lucide Icons
    lucide.createIcons();
</script>

</body>
</html>
