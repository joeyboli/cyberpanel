{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en" ng-app="loginSystem" class="light" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>{% trans "Login - CyberPanel" %}</title>
    <meta name="description" content="Login to your CyberPanel Account">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['DM Sans', 'system-ui', 'sans-serif'],
              mono: ['DM Mono', 'JetBrains Mono', 'monospace'],
              display: ['Syne', 'system-ui', 'sans-serif'],
            },
            colors: {
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              card: {
                DEFAULT: 'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
            },
            borderRadius: {
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 2px)',
              sm: 'calc(var(--radius) - 4px)',
            },
          }
        }
      }
    </script>

    <!-- Fonts: Syne (display) + DM Sans (body) + DM Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      /* ============================================================
         CYBERPANEL LOGIN — DESIGN SYSTEM (Matches baseTemplate/index.html)
      ============================================================ */

      :root {
        /* Light Mode */
        --background:        0 0% 100%;
        --foreground:        222 47% 11%;
        --card:              0 0% 100%;
        --card-foreground:   222 47% 11%;
        --popover:           0 0% 100%;
        --popover-foreground:222 47% 11%;
        --primary:           222 47% 11%;
        --primary-foreground:210 40% 98%;
        --secondary:         210 40% 96.1%;
        --secondary-foreground:222 47% 11.2%;
        --muted:             210 40% 96.1%;
        --muted-foreground:  215.4 16.3% 46.9%;
        --accent:            210 40% 96.1%;
        --accent-foreground: 222 47% 11.2%;
        --destructive:       0 84.2% 60.2%;
        --destructive-foreground:210 40% 98%;
        --border:            214.3 31.8% 91.4%;
        --input:             214.3 31.8% 91.4%;
        --ring:              222.2 84% 4.9%;
        --radius:            0.5rem;

        /* Brand accent: cyan-teal */
        --accent-cyan:       189 80% 42%;
      }

      .dark {
        --background:        222 22% 9%;
        --foreground:        215 20% 92%;
        --card:              222 22% 11%;
        --card-foreground:   215 20% 92%;
        --popover:           222 22% 11%;
        --popover-foreground:215 20% 92%;
        --primary:           0 0% 96%;
        --primary-foreground:222 30% 10%;
        --secondary:         222 20% 16%;
        --secondary-foreground:215 20% 85%;
        --muted:             222 20% 15%;
        --muted-foreground:  215 14% 52%;
        --accent:            189 60% 20%;
        --accent-foreground: 189 80% 72%;
        --destructive:       4 72% 45%;
        --destructive-foreground:0 0% 98%;
        --border:            222 22% 18%;
        --input:             222 22% 18%;
        --ring:              189 80% 42%;
      }

      body {
        font-family: 'DM Sans', system-ui, sans-serif;
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-size: 13.5px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }



      /* Loading spinner (legacy - kept for JS compatibility if needed, but hidden) */
      #verifyingLogin {
        display: none !important;
      }

      /* Smooth fade-in animation */
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Remove shadows globally for flat design */
      .no-shadow, .no-shadow * {
        box-shadow: none !important;
      }
    </style>

    <script src="{% static 'baseTemplate/assets/js-core/jquery-core.min.js' %}"></script>
    <script>
        var application = angular.module('loginSystem', []);
        application.config(['$interpolateProvider',
            function ($interpolateProvider) {
                $interpolateProvider.startSymbol('{$');
                $interpolateProvider.endSymbol('$}');
            }
        ]);
    </script>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

<div ng-controller="loginSystem" class="w-full max-w-md animate-fade-in">

    <!-- Logo & Header -->
    <div class="flex flex-col items-center mb-8">
        <div class="w-12 h-12 flex items-center justify-center mb-4">
             <img src="{% static 'baseTemplate/cyber-panel-logo.svg' %}" class="w-10 h-10 brightness-0 dark:invert" alt="CyberPanel">
        </div>
        <h1 class="text-2xl font-bold text-foreground">CyberPanel</h1>
    </div>

    <!-- Login Card - Modern Shadcn-like design -->
    <div class="bg-card text-card-foreground rounded-xl border border-border overflow-hidden">
        <div class="p-8 space-y-6">

            <!-- Card Header -->
            <div class="space-y-1">
                <h2 class="text-xl font-semibold text-foreground">{% trans "Welcome back" %}</h2>
                <p class="text-sm text-muted-foreground">{% trans "Sign in to your account" %}</p>
            </div>

            <form id="loginForm" action="/" class="space-y-4">

                <!-- Username Field -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-foreground" for="username">
                        {% trans "Username" %}
                    </label>
                    <input ng-model="username" type="text" id="username" name="username"
                           class="w-full px-3 py-2 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent transition-all placeholder:text-muted-foreground"
                           placeholder="{% trans 'Enter username' %}" required>
                </div>

                <!-- Password Field -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-foreground" for="password">
                        {% trans "Password" %}
                    </label>
                    <input ng-keypress="initiateLogin($event)" ng-model="password" type="password"
                           id="password" name="password" autocomplete="current-password"
                           class="w-full px-3 py-2 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent transition-all placeholder:text-muted-foreground"
                           placeholder="{% trans 'Enter password' %}" required>
                </div>

                <!-- 2FA Field (conditional) -->
                <div ng-hide="verifyCode" class="space-y-2 animate-fade-in">
                    <label class="text-sm font-medium text-foreground" for="twofa">
                        {% trans "2FA Code" %}
                    </label>
                    <input ng-model="twofa" type="text" id="twofa" name="twofa"
                           class="w-full px-3 py-2 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent transition-all placeholder:text-muted-foreground"
                           placeholder="{% trans '6-digit code' %}" required>
                </div>

                <!-- Language Selector -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-foreground" for="language">
                        {% trans "Language" %}
                    </label>
                    <select ng-model="languageSelection" ng-init="languageSelection='english'"
                            id="language"
                            class="w-full px-3 py-2 bg-background border border-input rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:border-transparent transition-all cursor-pointer">
                        <option value="english">English</option>
                        <option>Bangla</option>
                        <option>Bosnian</option>
                        <option>Bulgarian</option>
                        <option>Chinese</option>
                        <option>French</option>
                        <option>German</option>
                        <option>Greek</option>
                        <option>Italian</option>
                        <option>Indonesian</option>
                        <option>Japanese</option>
                        <option>Polish</option>
                        <option>Portuguese</option>
                        <option>Russian</option>
                        <option>Spanish</option>
                        <option>Turkish</option>
                        <option>Vietnamese</option>
                    </select>
                </div>

                <!-- Login Button - Refined with integrated loading -->
                <div class="pt-2">
                    <button type="button" ng-click="verifyLoginCredentials()" ng-disabled="isLoading"
                            class="relative w-full h-10 bg-primary text-primary-foreground rounded-lg font-medium text-sm transition-all hover:opacity-90 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span ng-if="isLoading">
                             <i data-lucide="loader-2" class="h-4 w-4 animate-spin"></i>
                        </span>
                        <span ng-if="!isLoading">{% trans "Sign In" %}</span>
                    </button>
                </div>
            </form>

            <!-- Error Message -->
            <div id="loginFailed" class="hidden p-3 rounded-lg bg-destructive/10 border border-destructive/20 text-destructive text-sm text-center animate-fade-in">
                <p class="flex items-center justify-center gap-2">
                    <i data-lucide="alert-circle" class="h-4 w-4"></i>
                    {% trans "Authentication Failed:" %} <span ng-bind="errorMessage"></span>
                </p>
            </div>
        </div>
    </div>

    <!-- Footer Links (optional) -->
    <div class="text-center mt-6 text-xs text-muted-foreground">
        <p>© {% now "Y" %} CyberPanel</p>
    </div>
</div>

<script src="{% static 'baseTemplate/angularjs.1.6.5.js' %}"></script>
<script src="https://code.angularjs.org/1.6.5/angular-route.min.js"></script>
<script src="{% static 'loginSystem/login-system.js' %}"></script>
<script>
    // Initialize Lucide Icons after DOM load
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    });
</script>

</body>
</html>
